<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="archivist-title archivist-desc">
  <title id="archivist-title">The Archivist at his reading desk</title>
  <desc id="archivist-desc">An original portrait of an older Breton man with a weathered, kindly face, silver hair and beard, and a sea-green hood fastened with brass. One hand rests on an open book at a wooden desk.</desc>
  <defs>
    <linearGradient id="av-paper" x2="0" y2="1">
      <stop stop-color="#FBF7EE"/><stop offset="1" stop-color="#E6D9BE"/>
    </linearGradient>
    <linearGradient id="av-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#377E77"/><stop offset=".52" stop-color="#286B68"/><stop offset="1" stop-color="#193F41"/>
    </linearGradient>
    <linearGradient id="av-skin" x1="0" y1="0" x2="1" y2=".7">
      <stop stop-color="#E8C6A0"/><stop offset=".55" stop-color="#D3A781"/><stop offset="1" stop-color="#B98061"/>
    </linearGradient>
    <linearGradient id="av-silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBF7EE"/><stop offset=".6" stop-color="#D5D5C9"/><stop offset="1" stop-color="#929B97"/>
    </linearGradient>
    <clipPath id="av-frame"><rect x="5" y="5" width="310" height="350" rx="25"/></clipPath>
    <clipPath id="av-eye-left"><path d="M116 134Q128 126 141 135Q128 142 116 134Z"/></clipPath>
    <clipPath id="av-eye-right"><path d="M166 135Q178 126 190 133Q179 141 166 135Z"/></clipPath>
  </defs>
  <g id="archivist-root" clip-path="url(#av-frame)" stroke-linecap="round" stroke-linejoin="round">
