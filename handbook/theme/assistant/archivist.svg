          <path d="m84 270 12-5 12 13 22 8q6 3 3 7-2 3-7 1l-14-4 8 12q3 5-2 7-4 2-7-3l-6-8 4 10q1 6-4 6-4 0-6-5l-4-9 1 8q0 5-5 4-4-1-5-7l-7-22Z" fill="url(#av-skin)" stroke="#654F43" stroke-width="2"/>
          <path d="m94 278 9 7m-13 0 8 8m8-8 7 4" fill="none" stroke="#9B7159" stroke-width="1.7"/>
          <path d="m83 271 11-4" stroke="#D9BF7D" stroke-width="3"/>
