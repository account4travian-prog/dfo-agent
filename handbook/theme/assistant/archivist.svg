              <path d="M156 160q-9-2-16 4l-9 8q15 3 26-5 12 8 27 3l-11-7q-9-5-17-3Z" fill="#E4E4D9" stroke="#929B97" stroke-width="1.2"/>
            </g>
          </g>
        </g>
      </g>
    </g>
        <g id="compass" aria-hidden="true">
          <path d="m139 238 12-9h18l13 9-12 10h-19Z" fill="#8A6A2F" stroke="#1F2328" stroke-width="2"/>
          <circle cx="160" cy="239" r="10" fill="#D9BF7D" stroke="#8A6A2F" stroke-width="2"/>
          <path d="m160 231 3 8-3 8-3-8Z" fill="#286B68"/><path d="M153 239h14" stroke="#8A6A2F"/>
        </g>
    <g id="av-desk" aria-hidden="true">
      <path d="M5 306q152-12 310 0v49H5Z" fill="#8A6A2F" stroke="#1F2328" stroke-width="3"/>
      <path d="M6 319h308v36H6Z" fill="#695136"/>
      <path d="M17 326h76m13 0h74m30 11h88M25 343h113" fill="none" stroke="#D2B17B" stroke-width="2" opacity=".35"/>
    </g>
    <g id="av-book-pose">
      <g id="book">
        <path d="m38 279 112 10 124-12 9 48-121 20-122-19Z" fill="#193F41" stroke="#1F2328" stroke-width="3"/>
        <path d="m42 283 114 10 115-12 5 39-114 19-115-18Z" fill="#D4BD8F" stroke="#8A6A2F" stroke-width="2"/>
        <path d="m48 318 112 16 111-18m-220-4 109 15 110-16" fill="none" stroke="#8A6A2F" stroke-width="1.5"/>
        <g id="left-page">
          <path d="M43 275q56-13 117 15v39q-62-24-110-14Z" fill="#FBF7EE" stroke="#8A6A2F" stroke-width="2"/>
          <path d="m61 285 28 1m-27 7q37-1 80 15m-77-7q33 0 63 11" fill="none" stroke="#8A6A2F" stroke-width="2.3"/>
          <path d="M98 285q25 3 44 11" fill="none" stroke="#565D60" stroke-width="2"/>
        </g>
        <g id="right-page">
          <path d="M160 290q57-29 108-18l4 40q-53-5-112 17Z" fill="#F4EEE1" stroke="#8A6A2F" stroke-width="2"/>
          <path d="M179 294q32-12 69-12m-69 20q39-13 74-12m-72 20q32-10 60-11" fill="none" stroke="#565D60" stroke-width="2.2"/>
        </g>
        <!-- A thin resting leaf expands only near the end of a reading cycle. -->
        <g id="page-turn" opacity="0" aria-hidden="true">
          <path d="M160 290q57-29 108-18l4 40q-53-5-112 17Z" fill="#FBF7EE" stroke="#8A6A2F" stroke-width="2"/>
          <path d="M179 294q32-12 69-12m-69 20q39-13 74-12" fill="none" stroke="#8A6A2F" stroke-width="2"/>
        </g>
        <path d="M160 291v39l9 7-7 8-9-8 4-8v-38" fill="#8A6A2F"/>
