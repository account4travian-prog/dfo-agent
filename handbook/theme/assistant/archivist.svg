      <path d="M38 206V131a122 122 0 0 1 244 0v75" fill="none" stroke="#8A6A2F" opacity=".23"/>
      <path d="M23 238h35m206 0h33M31 224h20m221 0h17M43 75l14 8m207-8-14 8" fill="none" stroke="#8A6A2F" stroke-width="2" opacity=".35"/>
      <circle cx="160" cy="42" r="3" fill="#8A6A2F"/>
    </g>
