                <g clip-path="url(#av-eye-right)"><g id="pupil-right"><circle cx="179" cy="134" r="5.3" fill="#286B68"/><circle cx="179" cy="134" r="2.8" fill="#1F2328"/><circle cx="177.5" cy="132.3" r="1.1" fill="#FBF7EE"/></g></g>
                <path d="M116 134q12-10 25 1m25 0q12-10 24-2" fill="none" stroke="#493E35" stroke-width="2.8"/>
                <path d="m114 141 10 3m62-2 8-4m-79-9-5-2m84 0 5-3" fill="none" stroke="#9B7159" stroke-width="1.8"/>
              </g>
              <g id="brows" fill="#E0E0D5" stroke="#929B97" stroke-width="1.3">
