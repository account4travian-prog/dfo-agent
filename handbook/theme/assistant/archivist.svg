              <path d="M158 133v15m-8 3 8 2" fill="none" stroke="#F0CDA6" stroke-width="2.5"/>
              <g id="beard">
                <path d="M110 150q8 16 20 18l25 4 26-5q14-4 24-20l-2 33q-5 34-43 51-35-13-45-45Z" fill="url(#av-silver)" stroke="#929B97" stroke-width="1.5"/>
                <path d="m119 169 8 28m4-17 10 32m3-28 9 32m39-48-9 31m-4-20-12 34m-4-27-3 33" fill="none" stroke="#899591" stroke-width="2"/>
