<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">The Firmament: two purses, connected paths</title>
<desc id="desc">Renown earns two Stars for each level after the first. Profession ranks earn Craft points for the life ring only. Craft is spent first for life stars and Stars cover any shortfall. The abstract branch shows a free start, small stars, a notable and a keystone that ends the path; it does not reproduce the actual sky. Ordinary weapon bonuses cap at plus 30 percent as a group and the whole blow at plus 50 percent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286B68"/></marker></defs>
<rect x="1" y="1" width="798" height="448" rx="16" fill="#FBF7EE" stroke="#D5CDBD"/><text x="32" y="45" font-size="29" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">The Firmament: two purses, connected paths</text><path d="M32 65 H768" fill="none" stroke="#8A6A2F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="86" width="352" height="92" rx="10" fill="#F4EEE1" stroke="#D5CDBD"/><text x="50" y="117" font-size="24" fill="#286B68" text-anchor="start" font-family="Georgia, serif">Renown → Stars</text><text x="50" y="145" font-size="19" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">2 per Renown after the first</text><text x="50" y="167" font-size="16" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Combat sky; also life-ring shortfalls</text><rect x="416" y="86" width="352" height="92" rx="10" fill="#F4EEE1" stroke="#D5CDBD"/><text x="434" y="117" font-size="24" fill="#286B68" text-anchor="start" font-family="Georgia, serif">Profession ranks → Craft</text><text x="434" y="145" font-size="19" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Life ring only · Craft spent first</text><text x="434" y="167" font-size="16" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Stars cover any remaining life cost</text><path d="M150 297 L252 254 L360 297 L479 240" fill="none" stroke="#286B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 254 L350 214" fill="none" stroke="#286B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 297 Q285 387 425 339" fill="none" stroke="#286B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><circle cx="150" cy="297" r="13" fill="#286B68" stroke="#286B68" stroke-width="2"/><circle cx="252" cy="254" r="7" fill="#FBF7EE" stroke="#286B68" stroke-width="2"/><circle cx="360" cy="297" r="11" fill="#FBF7EE" stroke="#286B68" stroke-width="2"/><circle cx="350" cy="214" r="7" fill="#FBF7EE" stroke="#286B68" stroke-width="2"/><path d="M479 222 L493 240 L479 258 L465 240 Z" fill="#286B68" stroke="#286B68"/><circle cx="425" cy="339" r="8" fill="#FBF7EE" stroke="#286B68" stroke-width="2"/><text x="92" y="327" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Free start</text><text x="227" y="237" font-size="17" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Small</text><text x="323" y="329" font-size="17" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Notable</text><text x="506" y="238" font-size="21" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Keystone</text><text x="506" y="265" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Path ends here</text><text x="443" y="345" font-size="19" fill="#286B68" text-anchor="start" font-family="system-ui, sans-serif">Life ring</text><text x="32" y="389" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Schematic branch: buy along connected stars; do not pass a keystone.</text><path d="M32 405 H768" fill="none" stroke="#8A6A2F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="433" font-size="19" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Caps: ordinary weapon group +30%; whole blow +50%.</text>
</svg>
