<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Choose the ground, then the pace</title>
<desc id="desc">Roads have the cheapest route cost, tracks cost more, and open ground costs most. A carriage is a paid shortcut. Outside the Open Zone pace caps are times 100 on roads or tracks and times 60 on open ground; Open Zone caps are times 40 and times 20. Default travel pace is times 60 and default near-enemy pace is times 5. Route shapes are schematic and have no distance scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286B68"/></marker></defs>
<rect x="1" y="1" width="798" height="448" rx="16" fill="#FBF7EE" stroke="#D5CDBD"/><text x="32" y="45" font-size="29" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Choose the ground, then the pace</text><path d="M32 65 H768" fill="none" stroke="#8A6A2F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="91" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Schematic routes · line lengths are not distances</text><circle cx="68" cy="245" r="12" fill="#286B68" stroke="#286B68" stroke-width="2"/><circle cx="730" cy="245" r="12" fill="#286B68" stroke="#286B68" stroke-width="2"/><text x="46" y="279" font-size="17" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Start</text><text x="686" y="279" font-size="17" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Destination</text><path d="M82 242 L165 135 H630 L716 242" fill="none" stroke="#286B68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="125" font-size="20" fill="#286B68" text-anchor="start" font-family="system-ui, sans-serif">Roads · cheapest / fastest</text><path d="M82 244 L220 202 H590 L716 244" fill="none" stroke="#8A6A2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6"/><text x="295" y="190" font-size="20" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Tracks · heavier cost</text><path d="M84 246 H714" fill="none" stroke="#565D60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7"/><text x="262" y="276" font-size="20" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Open ground · heaviest cost</text><path d="M85 295 Q400 375 715 295" fill="none" stroke="#286B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 6" marker-end="url(#arrow)"/><text x="269" y="329" font-size="20" fill="#286B68" text-anchor="start" font-family="system-ui, sans-serif">Carriage · paid shortcut</text><rect x="32" y="358" width="736" height="71" rx="10" fill="#F4EEE1" stroke="#D5CDBD"/><text x="48" y="384" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Pace caps: roads / tracks ×100; open ground ×60.</text><text x="48" y="411" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Open Zone: ×40 / ×20. Defaults: travel ×60; near enemies ×5.</text>
</svg>
