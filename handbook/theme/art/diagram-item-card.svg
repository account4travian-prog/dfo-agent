<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Read an item card</title>
<desc id="desc">Generic item-card anatomy: name, material or quality, rarity tier, condition or durability, damage or armour, sockets, and enchantment or reforge state. It depicts categories rather than an actual item or exact interface layout; fields vary with the item and identification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286B68"/></marker></defs>
<rect x="1" y="1" width="798" height="448" rx="16" fill="#FBF7EE" stroke="#D5CDBD"/><text x="32" y="45" font-size="29" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Read an item card</text><path d="M32 65 H768" fill="none" stroke="#8A6A2F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="91" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Generic schematic · fields vary by item and identification</text><rect x="42" y="110" width="360" height="300" rx="10" fill="#F4EEE1" stroke="#8A6A2F"/><text x="62" y="143" font-size="22" fill="#286B68" text-anchor="start" font-family="Georgia, serif">Item name</text><path d="M62 154 H382" fill="none" stroke="#D5CDBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 137 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="143" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Read the name</text><text x="62" y="183" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Material / quality</text><path d="M62 194 H382" fill="none" stroke="#D5CDBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 177 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="183" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Separate from rarity</text><text x="62" y="223" font-size="18" fill="#286B68" text-anchor="start" font-family="system-ui, sans-serif">Rarity tier</text><path d="M62 234 H382" fill="none" stroke="#D5CDBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 217 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="223" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Read the tier and added lines</text><text x="62" y="263" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Condition / durability</text><path d="M62 274 H382" fill="none" stroke="#D5CDBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 257 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="263" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Check the piece's wear</text><text x="62" y="303" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Damage / armour</text><path d="M62 314 H382" fill="none" stroke="#D5CDBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 297 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="303" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Depends on the type of gear</text><text x="62" y="343" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Sockets</text><path d="M62 354 H382" fill="none" stroke="#D5CDBD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M408 337 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="343" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Check available socket work</text><text x="62" y="383" font-size="18" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Enchantment / reforge state</text><path d="M408 377 H442" fill="none" stroke="#D5CDBD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458" y="383" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Identify to reveal hidden lines</text>
