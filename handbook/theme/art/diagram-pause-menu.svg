<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title desc">
<title id="title">Choose a pause-menu door</title>
<desc id="desc">The enhanced pause menu has Quests, Stats, Growth, Holdings, Family, Tutorials and System tabs. Firmament is under Growth; Companions, Stable and Fleet are under Holdings; Settings is under System. Family is conditional and other doors can depend on character state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286B68"/></marker></defs>
<rect x="1" y="1" width="798" height="528" rx="16" fill="#FBF7EE" stroke="#D5CDBD"/><text x="32" y="45" font-size="29" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Choose a pause-menu door</text><path d="M32 65 H768" fill="none" stroke="#8A6A2F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="91" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Enhanced pause menu · selected destinations</text><rect x="40" y="110" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#D5CDBD"/><text x="60" y="137" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Quests</text><rect x="40" y="159" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#D5CDBD"/><text x="60" y="186" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Stats</text><rect x="40" y="208" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#286B68"/><text x="60" y="235" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Growth</text><rect x="40" y="257" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#286B68"/><text x="60" y="284" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Holdings</text><rect x="40" y="306" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#D5CDBD"/><text x="60" y="333" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Family</text><text x="315" y="333" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Shown when Legacy conditions are met</text><rect x="40" y="355" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#D5CDBD"/><text x="60" y="382" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">Tutorials</text><rect x="40" y="404" width="190" height="40" rx="5" fill="#F4EEE1" stroke="#286B68"/><text x="60" y="431" font-size="21" fill="#1F2328" text-anchor="start" font-family="system-ui, sans-serif">System</text><path d="M230 228 H288" fill="none" stroke="#286B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="305" y="208" width="140" height="40" rx="5" fill="#FBF7EE" stroke="#286B68"/><text x="375" y="234" font-size="18" fill="#286B68" text-anchor="middle" font-family="system-ui, sans-serif">Firmament</text><path d="M230 277 H288" fill="none" stroke="#286B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="305" y="257" width="140" height="40" rx="5" fill="#FBF7EE" stroke="#286B68"/><text x="375" y="283" font-size="18" fill="#286B68" text-anchor="middle" font-family="system-ui, sans-serif">Companions</text><rect x="456" y="257" width="140" height="40" rx="5" fill="#FBF7EE" stroke="#286B68"/><text x="526" y="283" font-size="18" fill="#286B68" text-anchor="middle" font-family="system-ui, sans-serif">Stable</text><rect x="607" y="257" width="140" height="40" rx="5" fill="#FBF7EE" stroke="#286B68"/><text x="677" y="283" font-size="18" fill="#286B68" text-anchor="middle" font-family="system-ui, sans-serif">Fleet</text><path d="M230 424 H288" fill="none" stroke="#286B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="305" y="404" width="140" height="40" rx="5" fill="#FBF7EE" stroke="#286B68"/><text x="375" y="430" font-size="18" fill="#286B68" text-anchor="middle" font-family="system-ui, sans-serif">Settings</text><text x="40" y="496" font-size="18" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Doors can depend on enabled systems and your character's state.</text>
