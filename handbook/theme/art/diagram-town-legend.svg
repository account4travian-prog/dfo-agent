5 8 5 V23" fill="none" stroke="#286B68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="110" y="386" font-size="23" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Temple</text><text x="110" y="412" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Healing and faction services</text><g transform="translate(460 142)"><path d="M-22 23 V-21 H22 V23 M-22 -10 H22 M-11 -21 V-30 H11 V-21 M-6 23 V7 H6 V23" fill="none" stroke="#286B68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="500" y="140" font-size="23" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Guild hall</text><text x="500" y="166" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Membership and rank services</text><g transform="translate(460 224)"><path d="M-20 -23 H20 V0 Q17 17 0 26 Q-17 17 -20 0 Z M0 -14 V15 M-11 0 H11" fill="none" stroke="#286B68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="500" y="222" font-size="23" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Armorer</text><text x="500" y="248" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Armour sales and repairs</text><g transform="translate(460 306)"><path d="M-18 22 L17 -22 M8 -24 L23 -9 M-24 9 L-9 24 M-17 15 L-24 22" fill="none" stroke="#286B68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="500" y="304" font-size="23" fill="#1F2328" text-anchor="start" font-family="Georgia, serif">Weapon Smith</text><text x="500" y="330" font-size="17" fill="#565D60" text-anchor="start" font-family="system-ui, sans-serif">Weapon sales and repairs</text><g transform="translate(460 388)"><path d="M-23 23 V-8 L0 -25 L23 -8 V23 M-12 23 V2 H12 V23 M-23 -8 H23" fill="none" stroke="#286B68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="500" y="386"