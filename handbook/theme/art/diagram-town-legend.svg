<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Recognise a town service</title>
<desc id="desc">Eight original handbook symbols identify shops, banks, taverns, temples, guild halls, armorers, weapon smiths and stables. These are service cues for the guide, not a reproduction of the game's map icons.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286B68"/></marker></defs>
