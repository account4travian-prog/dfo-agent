<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">From race to summary</title>
<desc id="desc">Twelve overview screens in order: race, gender, class method, class, biography method, biography, name, face, attributes, skills, reflexes and summary. Methods can branch or skip questions. The levelling question follows the wizard; online characters use Classic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286B68"/></marker></defs>
